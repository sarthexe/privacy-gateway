# GLiNER-PII prompt labels -> Privacy Gateway entity types (offline benchmark only).
#
# nvidia/gliner-PII is prompted with label names; it can only return labels it is
# given.  Its model card names nvidia/Nemotron-PII as the training set and uses the
# native Nemotron label names (email, phone_number, user_name, ...), so the prompt
# vocabulary below is exactly the 55 Nemotron-PII labels, in a fixed order.
#
# Every target is explicit.  Because the benchmark ground truth was normalized with
# configs/pii_ontology.yaml, a GLiNER label with the same name must map to the same
# gateway type, otherwise the comparison with Presidio would not be like-for-like.
# The loader rejects any divergence that is not listed under `deviations` with a
# reason.  UNMAPPED predictions are never scored as a gateway type; they are
# counted as "removed by ontology filtering" and kept for native-label coverage.
model_id: nvidia/gliner-PII
model_revision: bd23e8ef4425fd04e34c5204ab49ffaa706eae79
deviations: {}
labels:
  account_number: BANK_ACCOUNT
  age: UNMAPPED
  api_key: UNMAPPED
  bank_routing_number: BANK_ACCOUNT
  biometric_identifier: UNMAPPED
  blood_type: UNMAPPED
  certificate_license_number: UNMAPPED
  city: LOCATION
